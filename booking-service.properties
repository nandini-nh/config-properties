spring.application.name=fleet-service

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:fleet_core}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:fleet}
spring.datasource.password=${MYSQL_PASSWORD:fleet}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.max-lifetime=900000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:GB-user-service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:greatbus-api}

spring.threads.virtual.enabled=true

server.port=${SERVER_PORT:8082}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.redis.enabled=false
management.metrics.tags.application=fleet-service
management.tracing.sampling.probability=${TRACE_SAMPLE_RATE:0.1}

logging.level.root=INFO
logging.level.com.enterprise.fleet=${LOG_LEVEL:INFO}

fleet.cache.schedule-search-ttl=PT60S
fleet.cache.seat-layout-ttl=PT6H
fleet.cache.route-ttl=PT30M
fleet.cache.bus-ttl=PT15M

fleet.search.default-page-size=20
fleet.search.max-page-size=50
fleet.search.max-forward-days=90

fleet.rate-limit.schedule-search=120
fleet.rate-limit.seat-layout=240
fleet.rate-limit.bus-registration=30
fleet.rate-limit.schedule-creation=60

fleet.events.enabled=${KAFKA_ENABLED:false}
fleet.events.schedule-updated-topic=schedule.updated
fleet.events.route-updated-topic=route.updated
fleet.events.bus-created-topic=fleet.bus.created
fleet.events.bus-status-changed-topic=fleet.bus.status.changed
fleet.events.route-created-topic=fleet.route.created
fleet.events.schedule-created-topic=fleet.schedule.created
fleet.events.schedule-cancelled-topic=fleet.schedule.cancelled
fleet.events.schedule-status-changed-topic=fleet.schedule.status.changed
fleet.events.schema-version=1.0

fleet.events.operator-consumer-enabled=${KAFKA_OPERATOR_CONSUMER_ENABLED:false}
fleet.events.operator-activated-topic=operator.activated
fleet.events.operator-suspended-topic=operator.suspended
fleet.events.operator-consumer-group=${KAFKA_GROUP:fleet-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual

fleet.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
