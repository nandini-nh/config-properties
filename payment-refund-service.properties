spring.application.name=payment-refund-service

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:payment_core}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mahakal@1218*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Without this, Hibernate 6's default UUID<->JDBC mapping writes UUID columns as raw
# BINARY(16) bytes, which fails MySQL's utf8mb4 string validation against the CHAR(36)
# columns used here (id, user_id, payment_id, refund_id) - force the CHAR representation
# to match what's actually in the schema.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 8081 now belongs to the api-gateway, so this service moved to 8084.
server.port=${SERVER_PORT:8084}
server.servlet.context-path=/api/v1

spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2

payment.redis.address=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}


payment.security.webhook.secret=${WEBHOOK_SECRET:local-dev-only-webhook-secret-please-override-in-production}

# Which gateway the money actually goes through. It stays on the stub until the
# Razorpay keys arrive; then PAYMENT_GATEWAY=razorpay plus the three values
# below, and nothing in the code changes. The service refuses to start on
# razorpay unless all three are set, so it can never run half-configured.
payment.gateway.provider=${PAYMENT_GATEWAY:stub}
payment.gateway.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.gateway.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.gateway.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
payment.gateway.razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com}

management.health.redis.enabled=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

payment.kafka.topic.payment-intent-created=payment.intent.created
payment.kafka.topic.payment-succeeded=payment.succeeded
payment.kafka.topic.payment-failed=payment.failed
payment.kafka.topic.refund-initiated=refund.initiated
payment.kafka.topic.refund-completed=refund.completed
payment.kafka.topic.refund-failed=refund.failed
payment.kafka.topic.refund-requested=refund.requested
payment.kafka.topic.partial-refund-issued=refund.partial.issued
payment.kafka.topic.refund-policy-applied=refund.policy.applied
payment.kafka.topic.payment-pending=payment.pending
payment.kafka.topic.payment-timeout=payment.timeout
payment.kafka.topic.duplicate-payment-detected=payment.duplicate.detected

payment.kafka.relay.interval-ms=5000
payment.kafka.relay.batch-size=200
payment.kafka.relay.max-attempts=5

spring.jackson.generator.write-bigdecimal-as-plain=true

logging.level.com.enterprise.payment=INFO

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.defaultModelsExpandDepth=-1

# ===========================================================================
# PLATFORM INTEGRATION - service discovery and centralised configuration
#
# Coordinates match the shared infrastructure:
#   eureka-server  8761      config-server  8888      api-gateway  8081
#
# "optional:" is deliberate. notification-service omits it so it hard-fails
# when config-server is down, but booking/payment are also run standalone for
# local development and QA, where no config server exists. Optional keeps both
# modes working; set CONFIG_SERVER_REQUIRED=true (drops the prefix) in any
# environment where starting without central config must be a startup failure.
# ===========================================================================

spring.cloud.config.username=${CONFIG_SERVER_USERNAME:config-admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:}

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# This service no longer validates JWTs - identity and access are owned by the
# user service and enforced at the api-gateway, which forwards the caller's id
# in the X-User-Id header. The former payment.security.jwt.* settings were removed
# because nothing read them and they wrongly implied HS256 validation here.

# Reject bodies carrying fields the DTO does not declare. Silently ignoring them hides
# client mistakes - a misspelled "amount" would look like a successful intent.
spring.jackson.deserialization.fail-on-unknown-properties=true

# discount-loyalty-service, for applying + confirming a coupon at payment-intent time.
# It requires a real user JWT (it validates tokens issued by user-service) plus
# X-Client-ID/X-Correlation-ID, so a coupon can only be applied when the caller's
# Authorization header reached this service and is forwarded as-is here - this service
# does not mint or validate the token itself.
payment.discount-service.base-url=${DISCOUNT_SERVICE_BASE_URL:http://localhost:8085/api/v1}
payment.discount-service.client-id=${DISCOUNT_SERVICE_CLIENT_ID:payment-refund-service}

# Callers are authenticated against user-service's JWKS. Same issuer and audience as
# every other service in the platform; the port is user-service's, not the gateway's.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:GB-user-service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:greatbus-api}
